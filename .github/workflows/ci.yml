name: Verify and build Windows preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/audit-public.js
      - run: node scripts/doctor.js
      - run: node tests/e2e-community-cdp.js
      - name: Package independent CI checkout
        run: npm run dist
      - name: Smoke test packaged application and terminal
        run: node tests/e2e-community-cdp.js --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: AIHubCommunity-Windows
          path: dist/AIHubCommunity-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GUI-validation
          path: |
            artifacts/community-gui
            artifacts/community-packaged-gui
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIHubCommunity-Windows
          path: release
      - name: Create checksums and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --prerelease --title "AI Hub Community $RELEASE_TAG" --notes "Windows preview. Uses your own AI accounts. Read INSTALL.md and docs/VALIDATION.md before use." *.exe SHA256SUMS.txt
